name: CI

# pull_request fires on every push to a branch with an open PR (covers "PR
# builds on each push"); push:main re-runs the same checks after merge, to
# catch issues from combining PRs that were each individually fine.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Runs the exact same .pre-commit-config.yaml as local hooks (mypy +
      # ruff + ruff-format) - single source of truth, no drift between what
      # a contributor's machine enforces and what CI enforces.
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `uv run` syncs the environment (including the `dev` dependency
      # group, which is where pytest lives) on demand - no separate sync
      # step needed. Tests don't need a live Postgres: SQLAlchemy's
      # create_engine() is lazy and .env.dev (committed) supplies a
      # syntactically valid but unreachable DATABASE_URL, which is enough
      # for every test in this suite (none of them execute a query).
      - run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Validates the Dockerfile still builds - catches a broken dependency
      # or Dockerfile change early. Does not push anywhere - the deploy job
      # below does the real, from-a-tag build+push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false

  # Non-blocking nudge for the version-bump-gated deploy below: if a PR
  # doesn't bump VERSION, merging it deploys nothing (see the deploy job's
  # "already tagged" skip) - most PRs should bump it, so a merge without one
  # should be a deliberate choice, not a silent miss. Warns via annotation
  # rather than failing the check, since some PRs (docs, CI-only) really
  # don't need a version bump.
  check-version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - name: Warn if VERSION wasn't bumped
        run: |
          # VERSION may not exist on the base branch yet (e.g. the PR that
          # introduces it) - `git show` would fail outright rather than
          # just reporting "nothing to compare", so fall back to empty.
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:VERSION" 2>/dev/null || echo "")
          HEAD_VERSION=$(cat VERSION)
          if [ -z "$BASE_VERSION" ]; then
            echo "VERSION doesn't exist on ${{ github.base_ref }} yet - nothing to compare."
          elif [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning file=VERSION::VERSION is still $HEAD_VERSION - if this PR should deploy when merged, bump it (patch/minor/major). Merging without a bump skips tagging and deploying entirely (see the deploy job in ci.yml)."
          else
            echo "VERSION bumped: $BASE_VERSION -> $HEAD_VERSION"
          fi

  # Tags and deploys the exact commit that just merged to main, but only
  # once lint/test/docker-build have all passed on it - and only if VERSION
  # was actually bumped for this merge (see check-version-bump above; a
  # merge that didn't bump it just means "no release this time", not a
  # failure). Runs terraform apply non-interactively - deployment/deploy.sh
  # remains for manual/hotfix deploys, this is the routine path.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-typecheck, test, docker-build]
    runs-on: ubuntu-latest
    # A deploy mid-`terraform apply` must never be cancelled by a second
    # merge landing right after - that can corrupt state / leave ECS
    # mid-update. Its own concurrency group (not the workflow-level one
    # above, which cancels stale lint/test/docker-build runs on purpose)
    # makes a second deploy queue behind the first instead of cancelling it.
    concurrency:
      group: gtfs-realtime-deploy
      cancel-in-progress: false
    permissions:
      id-token: write # required to assume the AWS OIDC role below
      contents: write # required to push the release tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full tag history to check/create the release tag

      - name: Determine release tag from VERSION
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: check_tag
        run: |
          git fetch origin --tags
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists - VERSION wasn't bumped for this merge. Skipping deploy."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        if: steps.check_tag.outputs.exists == 'false'
        with:
          # Must be >= 1.10 - deployment/main.tf's S3 backend relies on
          # native state locking (use_lockfile), added in 1.10.
          terraform_version: "1.15.8"

      - name: Terraform init
        if: steps.check_tag.outputs.exists == 'false'
        working-directory: deployment
        run: terraform init -input=false

      - name: Build and push backend image
        if: steps.check_tag.outputs.exists == 'false'
        working-directory: deployment
        run: |
          REPO_URL=$(terraform output -raw ecr_repository_url)
          aws ecr get-login-password --region us-east-2 \
            | docker login --username AWS --password-stdin "${REPO_URL%%/*}"
          TAG="${{ steps.version.outputs.tag }}"
          # Build from a clean archive of the tagged commit, not the
          # runner's working directory - matches deploy.sh's own approach,
          # so what's deployed is provably exactly what's tagged.
          git -C .. archive "$TAG" | docker build -t "$REPO_URL:$TAG" -
          docker push "$REPO_URL:$TAG"

      - name: Terraform apply
        if: steps.check_tag.outputs.exists == 'false'
        working-directory: deployment
        run: |
          terraform apply -input=false -auto-approve \
            -var="backend_image_tag=${{ steps.version.outputs.tag }}"
