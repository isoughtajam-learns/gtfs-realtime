name: CI

# pull_request fires on every push to a branch with an open PR (covers "PR
# builds on each push"); push:main re-runs the same checks after merge, to
# catch issues from combining PRs that were each individually fine.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Runs the exact same .pre-commit-config.yaml as local hooks (mypy +
      # ruff + ruff-format) - single source of truth, no drift between what
      # a contributor's machine enforces and what CI enforces.
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `uv run` syncs the environment (including the `dev` dependency
      # group, which is where pytest lives) on demand - no separate sync
      # step needed. Tests don't need a live Postgres: SQLAlchemy's
      # create_engine() is lazy and .env.dev (committed) supplies a
      # syntactically valid but unreachable DATABASE_URL, which is enough
      # for every test in this suite (none of them execute a query).
      - run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # linux/arm64 to match deploy.yml's real build target (ECS runs on
      # Graviton/t4g.small) - an arm64-only build failure (e.g. a
      # dependency with no arm64 wheel, needing to compile from source)
      # should show up here, not surface for the first time during an
      # actual deploy.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      # Validates the Dockerfile still builds - catches a broken dependency
      # or Dockerfile change early. Does not push anywhere - deploy.yml's
      # deploy job does the real, from-a-tag build+push, once this workflow
      # succeeds on main (see that file for how the two are chained).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false

  # Non-blocking nudge for deploy.yml's VERSION-gated deploy: if a PR
  # doesn't bump VERSION, merging it deploys nothing (deploy.yml skips when
  # VERSION's tag already exists) - most PRs should bump it, so a merge
  # without one should be a deliberate choice, not a silent miss. Warns via
  # annotation rather than failing the check, since some PRs (docs, CI-only)
  # really don't need a version bump.
  check-version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - name: Warn if VERSION wasn't bumped
        run: |
          # VERSION may not exist on the base branch yet (e.g. the PR that
          # introduces it) - `git show` would fail outright rather than
          # just reporting "nothing to compare", so fall back to empty.
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:VERSION" 2>/dev/null || echo "")
          HEAD_VERSION=$(cat VERSION)
          if [ -z "$BASE_VERSION" ]; then
            echo "VERSION doesn't exist on ${{ github.base_ref }} yet - nothing to compare."
          elif [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::warning file=VERSION::VERSION is still $HEAD_VERSION - if this PR should deploy when merged, bump it (patch/minor/major). Merging without a bump skips tagging and deploying entirely (see deploy.yml)."
          else
            echo "VERSION bumped: $BASE_VERSION -> $HEAD_VERSION"
          fi
