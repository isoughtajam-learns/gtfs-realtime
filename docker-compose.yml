services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gtfs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gtfs-network

  redis:
    image: redis:7-alpine
    container_name: gtfs-realtime-redis
    ports:
      - "6379:6379"
    networks:
      - gtfs-network

  backend:
    build: .
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env.dev_docker
    environment:
      # Passed through from your own shell when set, not written into
      # .env.dev_docker (committed) - same reasoning as every other
      # 511.org-backed migration's guard (see settings.py's
      # api_key_511_org). Only needed for `alembic upgrade head` to get
      # past a migration that writes a 511.org URL; harmless/unused
      # otherwise. Without it, `docker compose up` crash-loops this
      # container on any such pending migration - confirmed live when
      # IRL-16/17's migrations were the first ones run against an
      # existing local compose Postgres volume.
      - API_KEY_511_ORG
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
    networks:
      - gtfs-network

  celery-worker:
    build: .
    command: watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A src.tasks worker --loglevel=info
    env_file:
      - .env.dev_docker
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
    networks:
      - gtfs-network

  celery-beat:
    build: .
    command: watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A src.tasks beat --loglevel=info
    env_file:
      - .env.dev_docker
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
    networks:
      - gtfs-network

volumes:
  pgdata:

networks:
  gtfs-network:
    external: true
