repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0  # Use the latest available Mypy version
    hooks:
      - id: mypy
        # Pass files matching your codebase directory structure
        files: ^(src|tests)/
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic >= 2.0
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Get the latest version tag from the repo
    rev: v0.15.20
    hooks:
      # 1. Run the linter and fix safe errors automatically
      - id: ruff
        args: [ --fix ]

      # 2. Run the formatter to enforce consistent styling
      - id: ruff-format
