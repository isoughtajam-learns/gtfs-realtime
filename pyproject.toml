[project]
name = "gtfs-realtime"
version = "0.1.0"
description = "Python server implementation using gRPC to retrieve and stream realtime transit data using GTFS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.4.0",
    "fastapi[standard]>=0.139.2",
    "grpcio",
    "grpcio-tools",
    "gtfs-realtime-bindings",
    "posthog>=7.39.1",
    "psycopg2>=2.9.12",
    "psycopg2-binary",
    "redis>=5.2.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.51.0",
    "watchdog>=6.0.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",

    # Debian's own tzdata package (installed via apt by the base image) no
    # longer ships the IANA "backward" compatibility links - zone names
    # like "US/Pacific" that some GTFS feeds' agency.txt uses instead of
    # the canonical name (e.g. "America/Los_Angeles"). Confirmed live:
    # AC_Transit's agency.txt says "US/Pacific", which crashed with
    # ZoneInfoNotFoundError against this image's system zoneinfo but
    # resolves fine once Python's own tzdata package (which still includes
    # those links) is installed - zoneinfo.ZoneInfo() checks it before
    # giving up, regardless of platform.
    "tzdata>=2026.3",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

# generated/ is protoc output (grpc_tools.protoc), not hand-authored - its
# .pyi isn't guaranteed mypy-clean, and observably isn't: the same pinned
# mypy + types-protobuf versions produced 41 errors in CI but zero locally,
# purely from environment differences neither of us controls. Ignore errors
# originating in the module itself; code that imports from it is still
# type-checked normally.
[[tool.mypy.overrides]]
module = "generated.*"
ignore_errors = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
